[project]
name = "galaxies-creative-analysis"
version = "0.1.0"
description = "Experimentos locais de análise de criativos"
requires-python = ">=3.11,<3.12"
dependencies = [
  "av>=15,<17",
  "faster-whisper>=1.2,<2",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "psutil>=7,<8",
  "sentence-transformers>=5.1,<6",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers>=4.57,<5",
  "yt-dlp[default]>=2026.8.19",
  "imageio-ffmpeg>=0.6.0",
  "catboost>=1.2,<2",
  "lightgbm>=4.6,<5",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.14,<1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
