[project]
name = "galaxies-orchestration"
version = "0.1.0"
description = "Isolated local StateGraph boundary for the frozen M1 worker"
requires-python = ">=3.11,<3.12"
dependencies = ["langgraph==1.2.16"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
